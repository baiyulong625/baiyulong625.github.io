<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4553B"/>
      <stop offset="1" stop-color="#A03C22"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- 濠水波纹 -->
  <g fill="none" stroke="#FAFAF9" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <path d="M24 80 Q37 73 50 80"/>
    <path d="M60 83 Q70 78 80 83"/>
  </g>

  <!-- 气泡 -->
  <g fill="#FAFAF9" opacity="0.45">
    <circle cx="80" cy="24" r="2.2"/>
    <circle cx="87" cy="17" r="1.4"/>
  </g>

  <!-- 鱼身：上游的锦鲤 -->
  <path d="M84 48
           C 76 31, 53 25, 37 34
           C 32 37, 27 40, 21 38
           L 9 29
           C 15 41, 15 53, 9 65
           L 21 56
           C 27 58, 32 61, 38 63
           C 56 69, 78 63, 84 48 Z"
        fill="#FAFAF9"/>

  <!-- 鱼鳃 -->
  <path d="M62 35 C 58 40, 58 47, 62 53" fill="none"
        stroke="#B4472B" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>

  <!-- 眼 -->
  <circle cx="70" cy="42" r="3.4" fill="#B4472B"/>
  <circle cx="71.2" cy="40.8" r="1.1" fill="#FAFAF9"/>
</svg>
